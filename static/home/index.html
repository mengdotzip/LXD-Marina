<!DOCTYPE html>
<html>
    <head>
        <title>LXD-Marina</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="mainContainer">

            <div class="header">
                <h1>LXD-Marina</h1>
            </div>

            <!-- POP UPS -->

            <div class="confirmPopup" id="confirmPopupDiv">
                <a1 id="confirmText">Are you sure you want to DELETE the instance</a1>
                <button class="confirmBtns" id="confirmBtn" data-action="delete">DELETE</button>
                <button class="confirmBtns" data-action="cancel">CANCEL</button>
            </div>

            <div class="createPopup" id="createPopupDiv">
                <a1>Create Instance</a1>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <label for="server">Server:</label>
                <input type="text" id="server" name="server" value="https://cloud-images.ubuntu.com/releases/">

                <label for="alias">Alias:</label>
                <input type="text" id="alias" name="alias" value="24.04">

                <label class="radioBtn">
                    <input type="radio" name="radio" checked value="container"/>
                    Container
                </label>

                <label class="radioBtn">
                    <input type="radio" name="radio" value="virtual-machine"/>
                    VM
                </label>

                <button class="createBtns" id="apiCreateBtn" data-action="create">CREATE</button>
                <button class="createBtns" id="exitBtn" data-action="exit">EXIT</button>
            </div>

            <div class="instanceOptionsPopup" id="morePopupDiv">
                <a1 id="instanceOptionsHead">More Options</a1>
                <div class="optionsContainer">
                    <div class="tabsContainer">
                        <button class="tabBtn" id="tabSnapshots" onclick="window.openSnapshots()">SNAPS</button>
                        <button class="tabBtn">GPU</button>
                        <button class="tabBtn" id="tabDelete" onclick="window.openDelete()">DELETE</button>
                    </div>
                    <div class="drawTab">
                        <a1 id="drawTabHeader"></a1>
                        <div id="drawTabDiv"></div>
                    </div>
                </div>
                <button class="optionsBtn" data-action="exit" onclick="window.hideMoreOptions()">EXIT</button>
            </div>

            <!-- ------ -->

            <div class="usageBtns">
                <button id="refreshBtn">REFRESH</button>
                <button id="createBtn">CREATE</button>
            </div>

            <div class="instances" id="instancesDiv"></div>
            
            <div class="eventHeadContainer">
                <a>EVENTS:</a>
                <button class="eventClearBtn" onclick="window.clearEvents()">CLEAR</button>
            </div>
            <div class="events" id="eventsDiv"></div>

        </div>

        <script src="app.js" type="module"></script>
    </body>
</html>
